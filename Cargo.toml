[package]
name = "xythum-near-perps"
description = "Sandbox-only confidential BTC/mock-USDC liquidation prototype on native NEAR"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Builds the sandbox mock NEP-141 token instead of the clearing contract.
mock-token = ["dep:near-contract-standards"]
shielded-pool = []
browser-pool = ["shielded-pool", "dep:ark-bls12-381", "dep:ark-crypto-primitives", "dep:ark-ff"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = { version = "=5.30.1", optional = true }
ark-bls12-381 = { version = "=0.5.0", default-features = false, features = ["scalar_field"], optional = true }
ark-crypto-primitives = { version = "=0.5.0", default-features = false, features = ["sponge"], optional = true }
ark-ff = { version = "=0.5.0", default-features = false, optional = true }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
# Already in the near-sdk unit-testing graph; used only to sign test acknowledgments.
ed25519-dalek = "=2.2.0"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# `cfg(near)` was introduced in `near-sdk` v5.27.0, and is expected cfg now
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
