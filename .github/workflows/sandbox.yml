name: Native NEAR Sandbox

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funded-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.10.0'
          cache: npm
      - name: Verify native NEAR receipts
        run: bash scripts/sandbox.sh --sandbox-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-near-sandbox-evidence
          path: .sandbox/evidence.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify Rust suites
        run: bash scripts/sandbox.sh --rust-only
