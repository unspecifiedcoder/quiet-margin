app = "quiet-margin-backend"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "25s"

[build]
  dockerfile = "exchange/deploy/shielded/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  QUIET_POOL_HOST = "0.0.0.0"
  QUIET_POOL_ORIGIN = "https://quietmargin.outcomeseal.com"
  QUIET_POOL_FUNDING_DIR = "/data/claims"
  QUIET_POOL_FUNDING_QUOTA = "3"
  QUIET_POOL_KEEPER_FILE = "/run/quiet-margin/keepers.json"
  QUIET_POOL_LIQUIDATION_KEYS = "/app/artifacts"
  QUIET_POOL_PROVER = "/app/bin/quiet-pool-prover"

[[files]]
  guest_path = "/run/quiet-margin/operators.env"
  secret_name = "QUIET_OPERATOR_FILE_B64"

[[files]]
  guest_path = "/run/quiet-margin/keepers.json"
  secret_name = "QUIET_KEEPER_FILE_B64"

[[mounts]]
  source = "claims"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
